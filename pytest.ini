[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers. `integration` tests hit the live Equinix Fabric API and are NOT run
# on a normal `pytest` invocation / build — they are opt-in.
markers =
    integration: live API tests against Equinix Fabric (require credentials; run on demand)

# Skip integration tests by default. A command-line `-m` overrides this, so
# `pytest -m integration` (or ./run_fabric_tests.sh) runs them on demand.
addopts = -m "not integration"

# Capture request/response logs (logger "fabric.http") into the reports.
log_level = INFO
log_format = %(asctime)s %(name)s %(levelname)s %(message)s
junit_logging = all
junit_log_passing_tests = true
